[project]
name = "music-wiki"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mutagen>=1.47"]

[project.scripts]
music-wiki = "music_wiki.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
